<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM RAG Pipeline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0E1015;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      background: #181B22;
      border: 1px solid #333842;
      border-radius: 12px;
      font-size: 11px;
      color: #F59E0B;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 900px;
      height: 500px;
      background: #181B22;
      border: 1px solid #333842;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .node-rect {
      fill: #0E1015;
      stroke: #333842;
      stroke-width: 2;
      rx: 12px;
      transition: all 0.3s ease;
    }
    .node-rect:hover {
      stroke: #F59E0B;
      transform: translateY(-2px);
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #F59E0B;
      color: #0E1015;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LLM RAG Pipeline</h1>
    <div class="badge">animaflow.io &bull; Interactive Web Canvas</div>
  </div>

  <div id="canvas-container">
    <svg id="flow-svg"></svg>
  </div>

  <div class="controls">
    <button onclick="playAnimation()">▶ Play Animation</button>
    <button onclick="resetFlow()">↺ Reset</button>
  </div>

  <script>
    const flowData = {
  "title": "LLM RAG Pipeline",
  "theme": {
    "name": "DarkTerminal",
    "bg_color": "#0E1015",
    "surface_color": "#181B22",
    "border_color": "#333842",
    "text_color": "#FFFFFF",
    "text_muted": "#7D8590",
    "accent_color": "#F59E0B",
    "alert_color": "#EF4444",
    "success_color": "#10B981",
    "font_mono": "IBM Plex Mono",
    "font_sans": "IBM Plex Sans",
    "node_corner_radius": 0.12,
    "edge_width": 2.5
  },
  "nodes": [
    {
      "id": "4c0c1b03",
      "title": "Client",
      "subtitle": "Browser / App",
      "icon": "user",
      "shape": "rounded_rect",
      "status": "default",
      "width": 1.6,
      "height": 1.3,
      "position": [
        -3.3000000000000003,
        0.0,
        0.0
      ],
      "metadata": {}
    },
    {
      "id": "bbb64c4d",
      "title": "API Gateway",
      "subtitle": "FastAPI",
      "icon": "server",
      "shape": "rounded_rect",
      "status": "default",
      "width": 1.6,
      "height": 1.3,
      "position": [
        -1.1,
        0.0,
        0.0
      ],
      "metadata": {}
    },
    {
      "id": "91dd6940",
      "title": "Vector DB",
      "subtitle": "Qdrant / Milvus",
      "icon": "database",
      "shape": "rounded_rect",
      "status": "default",
      "width": 1.6,
      "height": 1.3,
      "position": [
        1.1,
        0.0,
        0.0
      ],
      "metadata": {}
    },
    {
      "id": "26a0b544",
      "title": "LLM Engine",
      "subtitle": "Claude 3.5",
      "icon": "cpu",
      "shape": "rounded_rect",
      "status": "default",
      "width": 1.6,
      "height": 1.3,
      "position": [
        3.3000000000000003,
        0.0,
        0.0
      ],
      "metadata": {}
    }
  ],
  "edges": [
    {
      "id": "8da3d3d6",
      "source_id": "4c0c1b03",
      "target_id": "bbb64c4d",
      "label": "Prompt",
      "style": "solid",
      "animated_packet": false,
      "metadata": {}
    },
    {
      "id": "e34b4fc4",
      "source_id": "bbb64c4d",
      "target_id": "91dd6940",
      "label": "Query Vector",
      "style": "solid",
      "animated_packet": false,
      "metadata": {}
    },
    {
      "id": "ec41913a",
      "source_id": "bbb64c4d",
      "target_id": "26a0b544",
      "label": "Context + Prompt",
      "style": "solid",
      "animated_packet": false,
      "metadata": {}
    }
  ],
  "timeline": {
    "actions": [
      {
        "action_type": "reveal_sequence",
        "target_id": null,
        "secondary_id": null,
        "duration": 0.4,
        "payload": null,
        "params": {}
      },
      {
        "action_type": "send_packet",
        "target_id": "4c0c1b03",
        "secondary_id": "bbb64c4d",
        "duration": 1.0,
        "payload": "POST /ask",
        "params": {}
      },
      {
        "action_type": "send_packet",
        "target_id": "bbb64c4d",
        "secondary_id": "91dd6940",
        "duration": 1.0,
        "payload": "search_knn()",
        "params": {}
      },
      {
        "action_type": "highlight_node",
        "target_id": "91dd6940",
        "secondary_id": null,
        "duration": 0.8,
        "payload": null,
        "params": {
          "status": "active"
        }
      },
      {
        "action_type": "send_packet",
        "target_id": "bbb64c4d",
        "secondary_id": "26a0b544",
        "duration": 1.0,
        "payload": "stream_tokens()",
        "params": {}
      },
      {
        "action_type": "highlight_node",
        "target_id": "26a0b544",
        "secondary_id": null,
        "duration": 0.8,
        "payload": null,
        "params": {
          "status": "success"
        }
      }
    ]
  }
};
    const svg = document.getElementById("flow-svg");
    const W = 900;
    const H = 500;

    function renderDiagram() {
      svg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#333842" />
          </marker>
        </defs>
      `;

      // Render Edges
      flowData.edges.forEach(edge => {
        const src = flowData.nodes.find(n => n.id === edge.source_id);
        const tgt = flowData.nodes.find(n => n.id === edge.target_id);
        if (src && tgt) {
          const x1 = W/2 + src.position[0] * 120 + 80;
          const y1 = H/2 - src.position[1] * 120;
          const x2 = W/2 + tgt.position[0] * 120 - 80;
          const y2 = H/2 - tgt.position[1] * 120;

          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", x1);
          line.setAttribute("y1", y1);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", y2);
          line.setAttribute("stroke", "#333842");
          line.setAttribute("stroke-width", "2");
          line.setAttribute("marker-end", "url(#arrow)");
          svg.appendChild(line);
        }
      });

      // Render Nodes
      flowData.nodes.forEach(node => {
        const cx = W/2 + node.position[0] * 120;
        const cy = H/2 - node.position[1] * 120;
        const nw = 140;
        const nh = 80;

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", "node-" + node.id);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", cx - nw/2);
        rect.setAttribute("y", cy - nh/2);
        rect.setAttribute("width", nw);
        rect.setAttribute("height", nh);
        rect.setAttribute("class", "node-rect");
        g.appendChild(rect);

        const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
        title.setAttribute("x", cx);
        title.setAttribute("y", cy - 5);
        title.setAttribute("text-anchor", "middle");
        title.setAttribute("fill", "#FFFFFF");
        title.setAttribute("font-size", "14");
        title.setAttribute("font-weight", "600");
        title.textContent = node.title;
        g.appendChild(title);

        if (node.subtitle) {
          const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
          sub.setAttribute("x", cx);
          sub.setAttribute("y", cy + 16);
          sub.setAttribute("text-anchor", "middle");
          sub.setAttribute("fill", "#7D8590");
          sub.setAttribute("font-size", "11");
          sub.textContent = node.subtitle;
          g.appendChild(sub);
        }

        svg.appendChild(g);
      });
    }

    function playAnimation() {
      // Packet animation example along edges
      flowData.edges.forEach((edge, idx) => {
        const src = flowData.nodes.find(n => n.id === edge.source_id);
        const tgt = flowData.nodes.find(n => n.id === edge.target_id);
        if (src && tgt) {
          const x1 = W/2 + src.position[0] * 120 + 70;
          const y1 = H/2 - src.position[1] * 120;
          const x2 = W/2 + tgt.position[0] * 120 - 70;
          const y2 = H/2 - tgt.position[1] * 120;

          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("r", "5");
          circle.setAttribute("fill", "#F59E0B");
          circle.setAttribute("cx", x1);
          circle.setAttribute("cy", y1);
          svg.appendChild(circle);

          const anim = circle.animate([
            { cx: x1, cy: y1, opacity: 0 },
            { opacity: 1, offset: 0.1 },
            { cx: x2, cy: y2, opacity: 1, offset: 0.9 },
            { cx: x2, cy: y2, opacity: 0 }
          ], {
            duration: 1200,
            delay: idx * 800,
            fill: "forwards"
          });

          anim.onfinish = () => circle.remove();
        }
      });
    }

    function resetFlow() {
      renderDiagram();
    }

    renderDiagram();
  </script>
</body>
</html>
