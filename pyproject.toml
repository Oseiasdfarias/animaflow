[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animaflow"
version = "0.1.0"
description = "Declarative, animated architecture flowcharts & diagrams for Python (Manim, Web/Canvas, Remotion)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Oséias Farias", email = "oseias.farias@gmail.com" }
]
keywords = [
    "diagram",
    "flowchart",
    "animation",
    "manim",
    "remotion",
    "canvas",
    "architecture",
    "presentation",
    "linkedin",
    "video"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
manim = [
    "manim>=0.18.0",
]
web = [
    "jinja2>=3.1.0",
]
all = [
    "manim>=0.18.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://animaflow.io"
Repository = "https://github.com/Oseiasdfarias/animaflow"
Documentation = "https://github.com/Oseiasdfarias/animaflow#readme"
"Bug Tracker" = "https://github.com/Oseiasdfarias/animaflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/animaflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
